name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  arch:
    name: Arch (cargo test + plugin build)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git rust pkgconf nasm clang libva mesa hyprland
      - uses: actions/checkout@v4
      - name: Format
        run: cargo fmt --all --check
      - name: Tests
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build plugin
        run: make -j"$(nproc)"
      - name: Build plugin without VA-API
        run: make clean && make -j"$(nproc)" NSC_VAAPI=0

  nix:
    name: Nix (packages.default)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build
        run: nix build -L .#default
